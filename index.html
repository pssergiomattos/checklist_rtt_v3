<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RTT Check - Controle de Qualidade</title>
    <meta name="description" content="Aplicativo de controle de qualidade para inspeções industriais, checklists fotográficos, ponto de orvalho e medição de carcaça." />
    <meta property="og:title" content="RTT Check - Controle de Qualidade" />
    <meta property="og:description" content="Aplicativo de controle de qualidade para inspeções industriais, checklists fotográficos, ponto de orvalho e medição de carcaça." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#8b0000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RTT Check" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="logo-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo-192.png" />
    <script>
      // Função universal para purgar caches e forçar reload limpo
      window.purgeRttCacheAndReload = function (reason) {
        console.warn('[RTT Watchdog] Purgando cache do app. Motivo:', reason || 'Desconhecido');
        
        // Feedback visual imediato se o botão existir
        var btn = document.getElementById('rtt-btn-atualizar');
        if (btn) {
          btn.disabled = true;
          btn.innerText = 'ATUALIZANDO...';
          btn.style.opacity = '0.7';
          btn.style.cursor = 'wait';
        }

        var doReload = function () {
          var targetUrl = window.location.pathname + '?nocache=' + Date.now();
          try {
            window.location.replace(targetUrl);
          } catch (e) {
            window.location.href = targetUrl;
          }
          // Fallback adicional caso o navegador segure a navegação
          setTimeout(function () {
            window.location.reload(true);
          }, 300);
        };

        var tasks = [];

        // 1. Desregistra todos os Service Workers
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                })
              );
            }).catch(function () {})
          );
        }

        // 2. Apaga todas as storages do Cache API
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                })
              );
            }).catch(function () {})
          );
        }

        // Executa com timeout de segurança (máximo 400ms para não travar em caso de erro de API)
        var reloadTriggered = false;
        var safeReload = function () {
          if (!reloadTriggered) {
            reloadTriggered = true;
            doReload();
          }
        };

        Promise.all(tasks).then(safeReload).catch(safeReload);
        setTimeout(safeReload, 400);
      };

      // Tratamento contra erro de hash antigo do Vite pós-deploy no GitHub
      window.addEventListener('vite:preloadError', function (event) {
        console.warn('Novo build detectado pelo Vite. Recarregando com versão nova...');
        window.purgeRttCacheAndReload('VitePreloadError');
      });

      // Captura erros globais de script / importação
      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'rtt_sw_err_reload_' + Math.floor(Date.now() / 20000);
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.purgeRttCacheAndReload('ScriptResourceError');
          }
        }
      }, true);

      // Registro do Service Worker com bypass estrito de cache
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              // Força verificação imediata por atualizações no servidor
              reg.update().catch(function () {});

              reg.onupdatefound = function () {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function () {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            })
            .catch(function (err) {
              console.warn('Registro do Service Worker ignorado:', err);
            });

          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }

      // WATCHDOG DE INICIALIZAÇÃO NO CELULAR:
      // Se após 3.5 segundos o React não tiver montado, atualiza o visual da tela
      // para orientar o operador e oferecer o botão direto de carregar atualização
      setTimeout(function () {
        if (!window.__RTT_APP_MOUNTED__) {
          var container = document.getElementById('rtt-loading-box');
          if (container) {
            container.innerHTML = [
              '<div style="width: 48px; height: 48px; border-radius: 50%; background: #fee2e2; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">',
              '  <svg style="width: 24px; height: 24px; color: #8b0000;" fill="none" viewBox="0 0 24 24" stroke="currentColor">',
              '    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />',
              '  </svg>',
              '</div>',
              '<div style="font-weight: 800; font-size: 17px; color: #8b0000; letter-spacing: -0.5px;">Atualização Disponível</div>',
              '<div style="font-size: 12px; color: #475569; margin-top: 6px; margin-bottom: 18px; max-width: 280px; line-height: 1.4;">',
              '  Uma nova versão do sistema foi publicada no GitHub.',
              '</div>',
              '<button id="rtt-btn-atualizar" type="button" onclick="window.purgeRttCacheAndReload(\'UserButton\')" style="background-color: #8b0000; color: #ffffff; border: none; padding: 12px 22px; border-radius: 10px; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; cursor: pointer; box-shadow: 0 3px 10px rgba(139,0,0,0.25); transition: opacity 0.2s;">',
              '  CARREGAR ATUALIZAÇÃO AGORA',
              '</button>',
            ].join('\n');
          }
        }
      }, 3500);
    </script>
  </head>
  <body class="bg-[#f0f2f5] text-slate-900 antialiased min-h-screen">
    <div id="root">
      <!-- Fallback visual enquanto o JavaScript é carregado no celular -->
      <div id="rtt-loading-box" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f0f2f5; color: #334155; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid #cbd5e1; border-top-color: #8b0000; animation: rtt-spin 0.8s linear infinite; margin-bottom: 14px;"></div>
        <div style="font-weight: 800; font-size: 18px; color: #8b0000; letter-spacing: -0.5px;">RTT Check</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 4px; font-weight: 500;">Carregando sistema...</div>
      </div>
      <style>
        @keyframes rtt-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
