<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RTT Check - Controle de Qualidade</title>
    <meta name="description" content="Aplicativo de controle de qualidade para inspeções industriais, checklists fotográficos, ponto de orvalho e medição de carcaça." />
    <meta property="og:title" content="RTT Check - Controle de Qualidade" />
    <meta property="og:description" content="Aplicativo de controle de qualidade para inspeções industriais, checklists fotográficos, ponto de orvalho e medição de carcaça." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#8b0000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RTT Check" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="logo-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo-192.png" />
    <script>
      // Tratamento para auto-recuperação contra cache de build antigo
      window.addEventListener('vite:preloadError', function () {
        console.warn('Novo build detectado pelo Vite. Recarregando...');
        window.location.reload();
      });

      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'rtt_sw_reload_' + Math.floor(Date.now() / 30000);
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        }
      }, true);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js')
            .then(function (reg) {
              console.log('RTT Check PWA registrado!', reg.scope);

              // Atualiza automaticamente quando um novo service worker é detectado
              reg.onupdatefound = function () {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function () {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            })
            .catch(function (err) {
              console.error('Erro ao registrar Service Worker:', err);
            });

          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#f0f2f5] text-slate-900 antialiased min-h-screen">
    <div id="root">
      <!-- Fallback visual enquanto o JavaScript é carregado no celular -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f0f2f5; color: #334155; padding: 20px; text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid #cbd5e1; border-top-color: #8b0000; animation: rtt-spin 0.8s linear infinite; margin-bottom: 14px;"></div>
        <div style="font-weight: 800; font-size: 18px; color: #8b0000; letter-spacing: -0.5px;">RTT Check</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 4px; font-weight: 500;">Carregando sistema...</div>
      </div>
      <style>
        @keyframes rtt-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
